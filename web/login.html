<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Quant 2.0 • Acesso Seguro</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2'><path d='M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .glow-cyan {
      box-shadow: 0 0 40px -10px rgba(6, 182, 212, 0.25);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Fundo Decorativo com Gradientes -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Container Principal -->
  <div class="w-full max-w-md relative z-10 space-y-6">
    
    <!-- Logo e Apresentação -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 mb-1 shadow-lg shadow-cyan-950/40">
        <i data-lucide="cpu" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
        Deriv Quant 2.0
      </h1>
      <p class="text-xs text-slate-400">
        Plataforma Quantitativa de Trading Algorítmico Multi-Contas
      </p>
    </div>

    <!-- Card de Autenticação -->
    <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl glow-cyan space-y-5">
      
      <!-- Alternador de Abas (Login / Cadastro) -->
      <div class="flex p-1 bg-slate-900/90 rounded-xl border border-slate-800 text-xs font-semibold">
        <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 shadow-sm">
          <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
          <span>Entrar</span>
        </button>
        <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200">
          <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
          <span>Criar Conta</span>
        </button>
      </div>

      <!-- Feedback de Mensagem -->
      <div id="auth-alert" class="hidden p-3 rounded-xl text-xs font-medium border flex items-center gap-2"></div>

      <!-- Formulário de Login -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Usuário ou E-mail</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-500"><i data-lucide="user" class="w-4 h-4"></i></span>
            <input type="text" id="login-username" required placeholder="admin" autocomplete="username"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-medium text-slate-400">Senha</label>
          </div>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-500"><i data-lucide="lock" class="w-4 h-4"></i></span>
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-10 py-2 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
            <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-login" class="w-full py-2.5 rounded-xl font-bold text-xs bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 transition cursor-pointer">
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
          <span>Acessar Meu Dashboard</span>
        </button>

        <p class="text-[11px] text-center text-slate-500 pt-1">
          Usuário padrão inicial: <strong class="text-cyan-400 font-mono">admin</strong> | Senha: <strong class="text-cyan-400 font-mono">admin123</strong>
        </p>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Nome Completo</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-500"><i data-lucide="badge-check" class="w-4 h-4"></i></span>
            <input type="text" id="reg-name" placeholder="Seu Nome ou Apelido"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Nome de Usuário (Login)</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-500"><i data-lucide="user" class="w-4 h-4"></i></span>
            <input type="text" id="reg-username" required placeholder="ex: trader_pro" autocomplete="username"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">E-mail (Opcional)</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-500"><i data-lucide="mail" class="w-4 h-4"></i></span>
            <input type="email" id="reg-email" placeholder="seuemail@exemplo.com" autocomplete="email"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Senha (Mínimo 6 caracteres)</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-500"><i data-lucide="lock" class="w-4 h-4"></i></span>
            <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" autocomplete="new-password"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-10 py-2 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
            <button type="button" onclick="togglePasswordVisibility('reg-password')" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-reg" class="w-full py-2.5 rounded-xl font-bold text-xs bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 text-white shadow-lg shadow-purple-500/20 flex items-center justify-center gap-2 transition cursor-pointer">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i>
          <span>Cadastrar e Acessar</span>
        </button>
      </form>

    </div>

    <!-- Rodapé -->
    <p class="text-center text-xs text-slate-600 font-mono">
      Deriv Quant v2.0 • Arquitetura Multi-Tenant Isolada
    </p>

  </div>

  <script>
    lucide.createIcons();

    function switchTab(tab) {
      const formLogin = document.getElementById("form-login");
      const formRegister = document.getElementById("form-register");
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      clearAlert();

      if (tab === "login") {
        formLogin.classList.remove("hidden");
        formRegister.classList.add("hidden");
        tabLogin.className = "flex-1 py-2 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 shadow-sm";
        tabRegister.className = "flex-1 py-2 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200";
      } else {
        formLogin.classList.add("hidden");
        formRegister.classList.remove("hidden");
        tabRegister.className = "flex-1 py-2 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 bg-purple-500/20 text-purple-300 border border-purple-500/30 shadow-sm";
        tabLogin.className = "flex-1 py-2 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200";
      }
    }

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === "password" ? "text" : "password";
    }

    function showAlert(msg, isError = true) {
      const el = document.getElementById("auth-alert");
      el.className = isError 
        ? "p-3 rounded-xl text-xs font-semibold border bg-rose-950/70 border-rose-500/40 text-rose-300 flex items-center gap-2"
        : "p-3 rounded-xl text-xs font-semibold border bg-emerald-950/70 border-emerald-500/40 text-emerald-300 flex items-center gap-2";
      el.innerHTML = `<i data-lucide="${isError ? 'alert-triangle' : 'check-circle'}" class="w-4 h-4 shrink-0"></i><span>${msg}</span>`;
      el.classList.remove("hidden");
      lucide.createIcons();
    }

    function clearAlert() {
      const el = document.getElementById("auth-alert");
      el.classList.add("hidden");
      el.innerHTML = "";
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearAlert();
      const btn = document.getElementById("btn-submit-login");
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span>Verificando...</span>';
      lucide.createIcons();

      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.status === "success") {
          localStorage.setItem("dq_token", data.token);
          localStorage.setItem("dq_user", JSON.stringify(data.user));
          document.cookie = `dq_token=${data.token}; path=/; max-age=2592000; SameSite=Lax`;
          showAlert(`Bem-vindo, ${data.user.name || data.user.username}! Redirecionando...`, false);
          setTimeout(() => {
            window.location.href = "/";
          }, 600);
        } else {
          showAlert(data.message || "Usuário ou senha inválidos.");
          btn.disabled = false;
          btn.innerHTML = origHtml;
          lucide.createIcons();
        }
      } catch (err) {
        showAlert("Erro de conexão com o servidor. Tente novamente.");
        btn.disabled = false;
        btn.innerHTML = origHtml;
        lucide.createIcons();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearAlert();
      const btn = document.getElementById("btn-submit-reg");
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span>Criando conta...</span>';
      lucide.createIcons();

      const name = document.getElementById("reg-name").value.trim();
      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, username, email, password })
        });
        const data = await res.json();

        if (res.ok && data.status === "success") {
          localStorage.setItem("dq_token", data.token);
          localStorage.setItem("dq_user", JSON.stringify(data.user));
          document.cookie = `dq_token=${data.token}; path=/; max-age=2592000; SameSite=Lax`;
          showAlert("Conta criada com sucesso! Redirecionando...", false);
          setTimeout(() => {
            window.location.href = "/";
          }, 800);
        } else {
          showAlert(data.message || "Erro ao criar conta.");
          btn.disabled = false;
          btn.innerHTML = origHtml;
          lucide.createIcons();
        }
      } catch (err) {
        showAlert("Erro ao se comunicar com o servidor.");
        btn.disabled = false;
        btn.innerHTML = origHtml;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
